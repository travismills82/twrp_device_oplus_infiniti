name: TWRP 16 Builder

on:
  workflow_dispatch:
    inputs:
      TWRP_MANIFEST_URL:
        description: "TWRP manifest url"
        required: true
        default: "https://github.com/TWRP-Test/platform_manifest_twrp_aosp"
      TWRP_MANIFEST_BRANCH:
        description: "TWRP branch"
        required: true
        default: "twrp-16.0"
      DEVICE_TREE_URL:
        description: "Device tree url"
        required: true
        default: "https://github.com/travismills82/twrp_device_oplus_infiniti"
      DEVICE_TREE_BRANCH:
        description: "Device tree branch"
        required: true
        default: "twrp-16.0"
      DEVICE_PATH:
        description: "Device path device/"
        required: true
        default: "oplus/infiniti"
      DEVICE_NAME:
        description: "Device name"
        required: true
        default: "infiniti"
      LUNCH_TARGET:
        description: "lunch twrp_ (default same as device name)"
        required: false
        default: ""
      BUILD_PARTITION:
        description: "Build partition"
        required: true
        default: "recovery"
      FLASHABLE_INSTALLER_BUILDER:
        description: "Device-tree path to flashable TWRP installer builder"
        required: true
        default: "prebuilts/flashable/build-twrp-installer.sh"
      PUBLISH_RELEASE:
        description: "Publish a signed release (requires verified compatibility profiles)"
        type: boolean
        default: false
      PRERELEASE:
        description: "Use the opt-in prerelease update channel"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Restrict release builds to the canonical stable checkout
      if: inputs.PUBLISH_RELEASE
      env:
        DEVICE_TREE_URL: ${{ inputs.DEVICE_TREE_URL }}
        DEVICE_TREE_BRANCH: ${{ inputs.DEVICE_TREE_BRANCH }}
        DEVICE_PATH: ${{ inputs.DEVICE_PATH }}
        DEVICE_NAME: ${{ inputs.DEVICE_NAME }}
        MANIFEST_URL: ${{ inputs.TWRP_MANIFEST_URL }}
        MANIFEST_BRANCH: ${{ inputs.TWRP_MANIFEST_BRANCH }}
        LUNCH: ${{ inputs.LUNCH_TARGET }}
        PARTITION: ${{ inputs.BUILD_PARTITION }}
        BUILDER: ${{ inputs.FLASHABLE_INSTALLER_BUILDER }}
      run: |
        set -euo pipefail
        [ "$GITHUB_REPOSITORY" = travismills82/twrp_device_oplus_infiniti ]
        [ "$GITHUB_REF" = refs/heads/twrp-16.0 ]
        [ "$DEVICE_TREE_URL" = https://github.com/travismills82/twrp_device_oplus_infiniti ]
        [ "$DEVICE_TREE_BRANCH" = twrp-16.0 ]
        [ "$DEVICE_PATH" = oplus/infiniti ] && [ "$DEVICE_NAME" = infiniti ]
        [ "$MANIFEST_URL" = https://github.com/TWRP-Test/platform_manifest_twrp_aosp ]
        [ "$MANIFEST_BRANCH" = twrp-16.0 ]
        [ -z "$LUNCH" ] || [ "$LUNCH" = infiniti ]
        [ "$PARTITION" = recovery ]
        [ "$BUILDER" = prebuilts/flashable/build-twrp-installer.sh ]
    - name: Show build info
      run: |
        if [ -n "${{ github.event.inputs.LUNCH_TARGET }}" ]; then
          echo "LUNCH_TARGET=${{ github.event.inputs.LUNCH_TARGET }}" >> "$GITHUB_ENV"
        else
          echo "LUNCH_TARGET=${{ github.event.inputs.DEVICE_NAME }}" >> "$GITHUB_ENV"
        fi
        {
          echo 'BUILD_INFO<<EOF'
          echo
          echo Manifest url: ${{ github.event.inputs.TWRP_MANIFEST_URL }}
          echo Manifest branch: ${{ github.event.inputs.TWRP_MANIFEST_BRANCH }}
          echo Device tree url: ${{ github.event.inputs.DEVICE_TREE_URL }}
          echo Device tree branch: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}
          echo Device path: ${{ github.event.inputs.DEVICE_PATH }}
          echo Device name: ${{ github.event.inputs.DEVICE_NAME }}
          echo Lunch target: ${{ github.event.inputs.LUNCH_TARGET }}
          echo TWRP version: 3.7.1-16
          echo Build target: ${{ github.event.inputs.BUILD_PARTITION }}.img
          echo Flashable installer builder: ${{ github.event.inputs.FLASHABLE_INSTALLER_BUILDER }}
          echo Build date: `date`
          echo
          echo EOF
        } >> "$GITHUB_ENV"
        echo BUILD_DATE=`date +%F` >> "$GITHUB_ENV"
        echo "TWRP_VERSION=3.7.1-16" >> "$GITHUB_ENV"
        echo "REPO_NAME=$(basename ${{ github.event.inputs.TWRP_MANIFEST_URL }})" >> "$GITHUB_ENV"

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Maximize build space
      uses: easimon/maximize-build-space@master

    - name: Setup environment
      run: |
        export DEBIAN_FRONTEND=noninteractive
        sudo apt-get update
        sudo apt-get install -y repo python3 zip unzip binutils libfreetype6 libssl-dev openssl
        git config --global user.name ${{ github.actor }}
        git config --global user.email ${{ github.actor }}@users.noreply.github.com

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2.23
      with:
        create-symlink: true
        max-size: 5G

    - name: Setup zram
      run: |
        sudo apt-get install -y linux-modules-extra-$(uname -r) zram-tools
        sudo modprobe zram
        sudo sed -i 's/^#PERCENT=50/PERCENT=90/' /etc/default/zramswap
        sudo sed -i 's/^#PRIORITY=100/PRIORITY=1000/' /etc/default/zramswap
        sudo systemctl restart zramswap
        zramctl

    - name: Sync source
      run: |
        repo init -u ${{ github.event.inputs.TWRP_MANIFEST_URL }} -b ${{ github.event.inputs.TWRP_MANIFEST_BRANCH }} --depth=1
        (while true; do echo "Syncing source..."; sleep 60; done) &
        TIP_PID=$!
        repo sync -c --no-clone-bundle --no-tags -j$(nproc --all)
        kill $TIP_PID && exit 0

    - name: Setup device
      run: |
        git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} device/${{ github.event.inputs.DEVICE_PATH }}

    - name: Verify reviewed release commit
      if: inputs.PUBLISH_RELEASE
      run: test "$(git -C device/oplus/infiniti rev-parse HEAD)" = "$GITHUB_SHA"

    - name: Validate device-tree executable permissions
      run: |
        HOOK="device/${{ github.event.inputs.DEVICE_PATH }}/recovery/root/system/etc/dhcpcd/dhcpcd-run-hooks"
        if [ ! -f "$HOOK" ]; then
          echo "Device tree is missing dhcpcd-run-hooks: $HOOK"
          exit 1
        fi
        if [ ! -x "$HOOK" ]; then
          echo "Device-tree dhcpcd-run-hooks is not executable: $(stat -c '%a %n' "$HOOK")"
          echo "Fix with: git update-index --chmod=+x recovery/root/system/etc/dhcpcd/dhcpcd-run-hooks"
          exit 1
        fi
        echo "Device-tree DNS hook: $(stat -c '%a %n' "$HOOK")"

    - name: Apply device recovery patches
      run: |
        bash device/${{ github.event.inputs.DEVICE_PATH }}/scripts/prepare-smb-deps.sh
        bash device/${{ github.event.inputs.DEVICE_PATH }}/scripts/select-recovery-source.sh
        bash device/${{ github.event.inputs.DEVICE_PATH }}/scripts/apply-recovery-patches.sh
        python3 device/${{ github.event.inputs.DEVICE_PATH }}/scripts/test-ab-ota-recovery-safety.py bootable/recovery
        python3 device/${{ github.event.inputs.DEVICE_PATH }}/scripts/test-sideload-usb.py
        python3 device/${{ github.event.inputs.DEVICE_PATH }}/scripts/test-decrypt-readiness.py
        python3 device/${{ github.event.inputs.DEVICE_PATH }}/scripts/test-wifi-runtime-firmware.py
        python3 device/${{ github.event.inputs.DEVICE_PATH }}/scripts/test-native-backup.py .
        python3 device/${{ github.event.inputs.DEVICE_PATH }}/scripts/test-gpu-renderer.py .
        g++ -std=c++17 -Wall -Wextra -Werror -I bootable/recovery device/${{ github.event.inputs.DEVICE_PATH }}/scripts/test-native-backup-safety.cpp -o /tmp/test-native-backup-safety
        /tmp/test-native-backup-safety "$(mktemp -d /tmp/twrp-native-backup-safety.XXXXXX)"
        python3 -B device/${{ github.event.inputs.DEVICE_PATH }}/scripts/test-smb-browser.py .
        g++ -std=c++17 -Wall -Wextra -Werror -I bootable/recovery device/${{ github.event.inputs.DEVICE_PATH }}/scripts/test-smb-browser.cpp -o /tmp/test-smb-browser
        /tmp/test-smb-browser
        bash device/${{ github.event.inputs.DEVICE_PATH }}/scripts/test-active-slot-updater.sh .
        git -C bootable/recovery diff --check
        git -C bootable/recovery status --short
        grep -n "Supplicant network ID" bootable/recovery/gui/action.cpp
        grep -n 'const char\* ping_bin = "/system/bin/ping"' bootable/recovery/gui/action.cpp
        grep -n '/system/bin/twrp-dns-publish wlan0' bootable/recovery/gui/action.cpp

    - name: Patch TWRP theme
      run: |
        python3 device/${{ github.event.inputs.DEVICE_PATH }}/tools/patch_twrp_magisk_theme.py bootable/recovery/gui/theme/common/portrait.xml
        python3 device/${{ github.event.inputs.DEVICE_PATH }}/scripts/test-oxygenos-dashboard.py .
        grep -n "twrp-flash-magisk" bootable/recovery/gui/theme/common/portrait.xml
        grep -n "twrp-ftp-menu" bootable/recovery/gui/theme/common/portrait.xml

    - name: Generate build info
      run: |
        echo -e "$BUILD_INFO" >> INFO.txt
        echo "Change log:" >> INFO.txt
        set +e
        LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null)
        if [ $? -eq 0 ]; then
          git log "$LAST_TAG"..HEAD --pretty=format:"- %h-%an: %s" >> INFO.txt
        else
          git log --pretty=format:"- %h-%an: %s" >> INFO.txt
        fi
        cat INFO.txt
      working-directory: device/${{ github.event.inputs.DEVICE_PATH }}

    - name: Embed updater build identity
      env:
        DEVICE_PATH: ${{ inputs.DEVICE_PATH }}
        PUBLIC_KEY: ${{ vars.OP15_UPDATER_PUBLIC_KEY }}
        PUBLISH: ${{ inputs.PUBLISH_RELEASE }}
        PREVIEW: ${{ inputs.PRERELEASE }}
      run: |
        set -euo pipefail
        [ "${GITHUB_RUN_ATTEMPT}" -lt 1000 ]
        build=$((GITHUB_RUN_NUMBER * 1000 + GITHUB_RUN_ATTEMPT))
        channel=development
        if [ "$PUBLISH" = true ]; then
          [ -n "$PUBLIC_KEY" ] || { echo 'Missing OP15_UPDATER_PUBLIC_KEY'; exit 1; }
          channel=stable
          if [ "$PREVIEW" = true ]; then channel=prerelease; fi
        fi
        DEVICE="device/$DEVICE_PATH"
        python3 "$DEVICE/tools/op15_update_release.py" identity --build "$build" \
          --channel "$channel" --public-key "$PUBLIC_KEY" --output "$DEVICE/updater/identity.json"

    - name: Build TWRP
      run: |
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export CCACHE_DIR=.ccache
        export CCACHE_EXEC=$(command -v ccache)
        export CCACHE_MAXSIZE=5G
        export USE_CCACHE=1
        lunch twrp_${{ env.LUNCH_TARGET }}
        OUT_DIR="out/target/product/${{ github.event.inputs.DEVICE_NAME }}"
        RECOVERY_ROOT="$OUT_DIR/recovery/root"
        (while true; do echo `date +%T` "Building TWRP..."; free -h; sleep 10; done) &
        TIP_PID=$!
        m ${{ github.event.inputs.BUILD_PARTITION }}image

        HOOK_PATH="$(find "$OUT_DIR" -type f -path '*/system/etc/dhcpcd/dhcpcd-run-hooks' -print -quit)"
        DNS_PUBLISH_PATH="$(find "$OUT_DIR" -type f -path '*/system/bin/twrp-dns-publish' -print -quit)"
        RESOLV_PATH="$(find "$OUT_DIR" -type f -path '*/system/etc/resolv.conf' -print -quit)"
        INIT_WIFI_RC="$RECOVERY_ROOT/init.recovery.wifi.rc"

        if [ -z "$HOOK_PATH" ]; then
          echo "Built recovery is missing dhcpcd-run-hooks"
          exit 1
        fi
        if [ ! -x "$HOOK_PATH" ]; then
          echo "Built dhcpcd-run-hooks is not executable: $(stat -c '%a %n' "$HOOK_PATH")"
          exit 1
        fi
        if [ -z "$DNS_PUBLISH_PATH" ]; then
          echo "Built recovery is missing twrp-dns-publish"
          exit 1
        fi
        if [ ! -x "$DNS_PUBLISH_PATH" ]; then
          echo "Built twrp-dns-publish is not executable: $(stat -c '%a %n' "$DNS_PUBLISH_PATH")"
          exit 1
        fi
        if [ -z "$RESOLV_PATH" ]; then
          echo "Built recovery is missing /system/etc/resolv.conf"
          exit 1
        fi
        if [ ! -f "$INIT_WIFI_RC" ]; then
          echo "Built recovery is missing init.recovery.wifi.rc"
          exit 1
        fi

        echo "DNS hook: $(stat -c '%a %n' "$HOOK_PATH")"
        echo "DNS publisher: $(stat -c '%a %n' "$DNS_PUBLISH_PATH")"
        echo "Resolver target: $(stat -c '%a %n' "$RESOLV_PATH")"
        grep -q 'twrp.wifi.dns.request' "$HOOK_PATH"
        grep -q '/tmp/twrp-resolv.conf' "$HOOK_PATH"
        grep -q 'mount -o bind' "$DNS_PUBLISH_PATH"
        grep -q 'twrp.wifi.dns.ready 1' "$DNS_PUBLISH_PATH"
        grep -q 'service twrp-dns-publish' "$INIT_WIFI_RC"
        grep -q 'on property:twrp.wifi.dns.request=1' "$INIT_WIFI_RC"

        if [ ! -d "$RECOVERY_ROOT" ]; then
          echo "Built recovery staging root was not found: $RECOVERY_ROOT"
          exit 1
        fi

        BRANDED_PATHS="$(find "$RECOVERY_ROOT" -print | grep -i -E '(^|/)[^/]*(orangefox|ofrp)[^/]*$' || true)"
        if [ -n "$BRANDED_PATHS" ]; then
          echo "Recovery staging tree contains branded filenames:"
          echo "$BRANDED_PATHS"
          exit 1
        fi

        BRANDED_TEXT="$(grep -R -I -n -i -E 'OrangeFox|Orange Fox|OFRP' "$RECOVERY_ROOT" 2>/dev/null || true)"
        if [ -n "$BRANDED_TEXT" ]; then
          echo "Recovery staging tree contains branded text:"
          echo "$BRANDED_TEXT"
          exit 1
        fi

        BINARY_BRANDING=0
        while IFS= read -r -d '' FILE; do
          MATCHES="$(strings -a "$FILE" 2>/dev/null | grep -i -E 'OrangeFox|Orange Fox|OrangeFox Recovery Project' || true)"
          if [ -n "$MATCHES" ]; then
            echo "Recovery binary contains branded printable strings: $FILE"
            echo "$MATCHES"
            BINARY_BRANDING=1
          fi
        done < <(find "$RECOVERY_ROOT" -type f -print0)

        if [ "$BINARY_BRANDING" -ne 0 ]; then
          exit 1
        fi

        echo "Recovery branding scan: clean"

        IMAGE_NAME="TWRP-${TWRP_VERSION}-${{ github.event.inputs.DEVICE_NAME }}-${BUILD_DATE}.img"
        mv "$OUT_DIR/${{ github.event.inputs.BUILD_PARTITION }}.img" "$OUT_DIR/$IMAGE_NAME"
        echo "TWRP_IMAGE=$OUT_DIR/$IMAGE_NAME" >> "$GITHUB_ENV"
        echo "TWRP_ZIP=$OUT_DIR/${IMAGE_NAME%.img}.zip" >> "$GITHUB_ENV"
        kill $TIP_PID && exit 0

    - name: Verify packed dashboard, AVB budget, GPU renderer and startup
      run: |
        python3 device/${{ github.event.inputs.DEVICE_PATH }}/tools/verify_oxygenos_image.py "$TWRP_IMAGE" --root .
        python3 device/${{ github.event.inputs.DEVICE_PATH }}/scripts/verify-gpu-image.py "$TWRP_IMAGE" --root .
        python3 device/${{ github.event.inputs.DEVICE_PATH }}/scripts/test-active-slot-updater-release.py . "$TWRP_IMAGE"

    - name: Build clean slot-A flashable ZIP
      run: |
        BUILDER="device/${{ github.event.inputs.DEVICE_PATH }}/${{ github.event.inputs.FLASHABLE_INSTALLER_BUILDER }}"

        if [ ! -f "$BUILDER" ]; then
          echo "Flashable installer builder was not found: $BUILDER"
          exit 1
        fi

        bash "$BUILDER" \
          "$TWRP_IMAGE" \
          "$TWRP_ZIP" \
          "TWRP $TWRP_VERSION" \
          "OnePlus 15 (infiniti)"

        unzip -t "$TWRP_ZIP"
        unzip -p "$TWRP_ZIP" META-INF/com/google/android/twrp-version
        unzip -p "$TWRP_ZIP" META-INF/com/google/android/update-binary | grep -q 'find_partition recovery_a'
        if unzip -p "$TWRP_ZIP" META-INF/com/google/android/update-binary | \
          grep -q -E 'find_partition recovery_b|flash_partition recovery_b'; then
          echo "Generated installer can modify recovery_b"
          exit 1
        fi

        if unzip -Z1 "$TWRP_ZIP" | grep -i -E -q 'OrangeFox|Orange Fox|OFRP'; then
          echo "OrangeFox/OFRP filename found in generated installer"
          exit 1
        fi

        if unzip -p "$TWRP_ZIP" META-INF/com/google/android/update-binary \
          META-INF/com/google/android/updater-script \
          META-INF/com/google/android/twrp-version \
          INSTALL.txt | grep -a -i -E -q 'OrangeFox|Orange Fox|OFRP'; then
          echo "OrangeFox/OFRP branding found in generated installer"
          exit 1
        fi

        ls -lh "$TWRP_IMAGE" "$TWRP_ZIP"

    - name: Stage verified build artifacts
      env:
        DEVICE_PATH: ${{ inputs.DEVICE_PATH }}
      run: |
        set -euo pipefail
        stage="$RUNNER_TEMP/op15-build-artifacts"
        mkdir -p "$stage"
        cp -- "$TWRP_IMAGE" "$stage/recovery.img"
        cp -- "$TWRP_ZIP" "$stage/"
        cp -- "device/$DEVICE_PATH/updater/identity.json" "$stage/identity.json"
        cp -- "device/$DEVICE_PATH/INFO.txt" "$stage/INFO.txt"
        (cd "$stage" && sha256sum recovery.img > build.sha256)

    - name: Retain verified build
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-infiniti-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/op15-build-artifacts/
        if-no-files-found: error

  release:
    needs: build
    if: ${{ inputs.PUBLISH_RELEASE && github.repository == 'travismills82/twrp_device_oplus_infiniti' && github.ref == 'refs/heads/twrp-16.0' }}
    runs-on: ubuntu-latest
    environment: op15-updater-release
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 10
        persist-credentials: false
    - uses: actions/download-artifact@v4
      with:
        name: TWRP-infiniti-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/op15-build-artifacts
    - name: Verify release candidate handoff
      run: |
        set -euo pipefail
        [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
        sudo apt-get update
        sudo apt-get install -y lz4 cpio
        python3 -B scripts/test-op15-release-publication.py
        stage="$RUNNER_TEMP/op15-build-artifacts"
        grep -Ex '[0-9a-f]{64}  recovery\.img' "$stage/build.sha256" >/dev/null
        [ "$(wc -l < "$stage/build.sha256")" -eq 1 ]
        (cd "$stage" && sha256sum -c build.sha256)
        python3 tools/op15_update_release.py verify-identity --image "$stage/recovery.img" \
          --identity "$stage/identity.json" --commit "$GITHUB_SHA" \
          --build "$((GITHUB_RUN_NUMBER * 1000 + GITHUB_RUN_ATTEMPT))"
    - name: Prepare signed updater assets
      env:
        UPDATE_KEY: ${{ secrets.OP15_UPDATER_SIGNING_KEY }}
        PROFILES: ${{ vars.OP15_UPDATER_COMPATIBILITY_PROFILES }}
        PREVIEW: ${{ inputs.PRERELEASE }}
      run: |
        set -euo pipefail
        umask 077
        [ -n "$UPDATE_KEY" ] && [ -n "$PROFILES" ]
        temp="$(mktemp -d)"
        trap 'rm -f -- "$temp/signing.pem" "$temp/profiles.json" "$temp/notes"; rmdir "$temp"' EXIT
        printf '%s\n' "$UPDATE_KEY" > "$temp/signing.pem"
        unset UPDATE_KEY
        printf '%s\n' "$PROFILES" > "$temp/profiles.json"
        git log -8 --format='- %h %s' | cut -c1-220 > "$temp/notes"
        assets="$RUNNER_TEMP/op15-build-artifacts"
        channel=stable
        if [ "$PREVIEW" = true ]; then channel=prerelease; fi
        python3 -c 'import json,sys; assert json.load(open(sys.argv[1]))["channel"] == sys.argv[2]' \
          "$assets/identity.json" "$channel"
        tag="$(date -u +%F)-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        python3 tools/op15_update_release.py sign --identity "$assets/identity.json" \
          --image "$assets/recovery.img" --profiles "$temp/profiles.json" --notes "$temp/notes" \
          --tag "$tag" --key "$temp/signing.pem" --output "$assets"
        (cd "$assets" && sha256sum -c SHA256SUMS)
        printf 'UPDATE_ASSETS=%s\nUPDATE_TAG=%s\n' "$assets" "$tag" >> "$GITHUB_ENV"

    - name: Publish verified recovery and installer
      env:
        GH_TOKEN: ${{ github.token }}
        PUBLIC_KEY: ${{ vars.OP15_UPDATER_PUBLIC_KEY }}
        PREVIEW: ${{ inputs.PRERELEASE }}
      run: |
        set -euo pipefail
        channel=stable
        if [ "$PREVIEW" = true ]; then channel=prerelease; fi
        python3 tools/op15_update_release.py publish --assets "$UPDATE_ASSETS" \
          --tag "$UPDATE_TAG" --commit "$GITHUB_SHA" --channel "$channel" \
          --public-key "$PUBLIC_KEY" --title "TWRP 3.7.1-16 infiniti — $UPDATE_TAG" \
          --release-notes "$UPDATE_ASSETS/INFO.txt"
